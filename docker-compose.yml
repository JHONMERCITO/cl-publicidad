version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: big-arte-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: big_arte
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: big_arte_user
      MYSQL_PASSWORD: big_arte_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - big-arte-network

  # Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: big-arte-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=big_arte
      - DB_USERNAME=big_arte_user
      - DB_PASSWORD=big_arte_password
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - mysql
    networks:
      - big-arte-network

  # Servidor web Nginx para Laravel
  nginx:
    image: nginx:alpine
    container_name: big-arte-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - big-arte-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: big-arte-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - big-arte-network

  # Adminer para gestión de base de datos (opcional)
  adminer:
    image: adminer
    container_name: big-arte-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - big-arte-network

volumes:
  mysql_data:

networks:
  big-arte-network:
    driver: bridge
