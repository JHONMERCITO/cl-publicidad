[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.gd",
  "php82Extensions.fileinfo",
  "php82Extensions.zip",
  "php82Extensions.bcmath",
  "php82Extensions.openssl",
  "php82Extensions.tokenizer",
  "php82Extensions.ctype",
  "php82Extensions.curl",
  "composer"
]

[variables]
NIXPACKS_PHP_VERSION = "8.2"

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear",
  "php artisan storage:link || true"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
